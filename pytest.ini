[pytest]
# The suite is written with unittest.TestCase, which pytest runs natively.
# Keeping one configuration file means `pytest` and `unittest discover`
# disagree about nothing except the progress output.
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*

# esp_font_build.py lives in tests/ but is a build driver, not a test.
# It is excluded here and documented in docs/TESTING.md.
norecursedirs = font_stubs __pycache__

addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    needs_host_cc: requires a POSIX C compiler (native on Linux, WSL on Windows)
    needs_linux: exercises Linux-only syscalls (fcntl, SIGALRM, /sys, pty)
    needs_artifacts: requires build outputs that a documented build step produces
