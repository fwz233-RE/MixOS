<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'">
<title>MixOS · Offline UI preview</title>
<style>
:root{color-scheme:dark;--bg:#13171a;--card:#1d2327;--raised:#2b3338;--text:#f0f5f3;--muted:#a3b2b0;--accent:#87ebc2;--warn:#f4be6f;--line:#34413f}
[data-theme=paper]{color-scheme:light;--bg:#f1f4f0;--card:#fffffb;--raised:#dee7dd;--text:#1d2e26;--muted:#4e655a;--accent:#187451;--warn:#97500e;--line:#ccd8cc}
[data-theme=midnight]{--bg:#11192a;--card:#1a263b;--raised:#273750;--text:#ebf2ff;--muted:#a5bbd7;--accent:#88c1ff;--warn:#ffca84;--line:#394c69}
[data-theme=ember]{--bg:#1d1816;--card:#2a221d;--raised:#3c3024;--text:#fff2dd;--muted:#c6b092;--accent:#f4bc6a;--warn:#ff9a80;--line:#554332}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{border:1px solid transparent;border-radius:11px;padding:11px 17px;background:var(--raised);color:var(--text);cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--accent);color:var(--bg);font-weight:650}button:disabled{cursor:default;opacity:.45}p,h1,h2,h3{margin:0}h1{font-size:32px;font-weight:650;letter-spacing:-1px}h2{font-size:24px;font-weight:600}h3,.eyebrow{color:var(--muted);font-size:12px;font-weight:650;letter-spacing:1.6px;text-transform:uppercase}.muted{color:var(--muted)}.warn{color:var(--warn)}.accent{color:var(--accent)}.small{font-size:13px}
.preview-bar{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}.preview-bar strong{font-size:13px;color:var(--accent)}.preview-bar label{font-size:13px;display:flex;align-items:center;gap:10px}.preview-bar select{padding:5px 10px}
.statusbar{display:flex;align-items:center;gap:18px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}.statusbar .title{font-weight:650;font-size:16px;margin-right:auto}.statusbar .chip{display:flex;align-items:center;gap:7px;color:var(--muted)}.statusbar .chip strong{color:var(--text);font-weight:550}.batt{display:inline-block;width:34px;height:16px;border:2px solid currentColor;border-radius:4px;position:relative}.batt:after{content:'';position:absolute;right:-5px;top:4px;width:3px;height:6px;background:currentColor}.batt span{display:block;height:100%;background:currentColor;border-radius:1px}.bars{display:inline-flex;align-items:flex-end;gap:2px;height:16px}.bars i{width:4px;background:var(--raised);border-radius:1px}.bars i.on{background:var(--text)}
.shell{max-width:1088px;margin:auto;padding:26px 32px 106px}
.launcher{display:grid;grid-template-columns:1fr 1fr;gap:24px}.launch-card{background:var(--card);border:2px solid transparent;border-radius:24px;padding:28px;text-align:left;display:block;width:100%;min-height:210px}.launch-card[aria-current=true]{border-color:var(--accent)}.launch-card .glyph{font-size:44px;line-height:1;color:var(--accent)}.launch-card h2{margin-top:18px}.launch-card p{color:var(--muted);margin-top:8px}.launch-card .state{margin-top:14px;font-size:13px;color:var(--muted)}.launch-card .state.warn{color:var(--warn)}.launch-card .state.accent{color:var(--accent)}
.settings{display:grid;grid-template-columns:224px 1fr;gap:24px}.rail{display:grid;gap:12px;align-content:start}.rail button{text-align:left}.rail button[aria-current=page]{background:var(--accent);color:var(--bg);font-weight:650}
.grid{display:grid;gap:24px}.two{grid-template-columns:1.8fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.equal{grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}.card p{margin-top:10px}.section{margin-top:24px}.metric strong{display:block;font-size:30px;font-weight:550;margin-top:12px;letter-spacing:-.7px}.metric strong small{font-size:18px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.stack{display:grid;gap:16px}.bar{height:10px;background:var(--raised);border-radius:8px;overflow:hidden;margin-top:16px}.bar span{display:block;height:100%;background:var(--accent);border-radius:8px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.theme-grid button{text-align:left}.swatch{display:inline-block;width:13px;height:13px;background:var(--swatch);border-radius:50%;margin-right:10px;border:1px solid currentColor}.language-buttons,.geometry-buttons{display:flex;gap:12px;margin-top:20px}.language-buttons button,.geometry-buttons button{flex:1}.control-row{padding:14px 0;border-bottom:1px solid var(--line)}.control-row:last-child{border:0}.control-row button{padding:8px 14px}input[type=range]{width:100%;accent-color:var(--accent);margin:18px 0}
.net-list{display:grid;gap:10px;margin-top:18px}.net-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left}.net-row .ssid{margin-right:auto}.net-row .tag{font-size:12px;color:var(--muted)}.net-row .tag.saved{color:var(--accent)}.passphrase{display:flex;gap:12px;margin-top:16px}.passphrase input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-family:monospace;letter-spacing:2px}
svg{display:block;width:100%;height:160px;margin-top:18px}svg .gridline{stroke:var(--line);stroke-width:1}svg polyline{fill:none;stroke-width:2.5;stroke-linejoin:round}.legend{display:flex;gap:24px;flex-wrap:wrap;font-size:12px;margin-top:14px}.sensor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.sensor{padding:11px 12px;background:var(--raised);border-radius:10px;font-size:13px}.sensor span{float:right;color:var(--accent)}
.touch-pad{position:relative;height:180px;border:1px dashed var(--line);border-radius:14px;margin-top:18px;overflow:hidden;touch-action:none;user-select:none;display:grid;place-items:center;color:var(--muted)}.touch-pad.testing{border-color:var(--accent)}.touch-dot{position:absolute;width:28px;height:28px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}.touch-dot:after{content:'+';display:block;text-align:center;color:var(--accent);line-height:22px}
.terminal-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.terminal-toolbar button{padding:6px 12px;font-size:13px}.terminal-toolbar .muted{margin-right:auto}.terminal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#101619}.terminal-grid{font:20px/24px ui-monospace,Consolas,"Liberation Mono",monospace;white-space:pre;margin:0 auto;color:#dce9e3;outline:none}.term-row{display:flex}.term-cell{display:block;overflow:hidden;text-align:center}.term-cell.cursor{box-shadow:inset 0 -2px #87ebc2}.terminal-entry{display:flex;gap:10px;margin-top:12px}.terminal-entry input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-family:monospace}
.placeholder{display:grid;place-items:center;gap:14px;padding:80px 24px;text-align:center}.placeholder .glyph{font-size:72px;color:var(--raised)}.spinner{display:flex;gap:10px;margin-top:18px}.spinner i{width:14px;height:14px;border-radius:50%;background:var(--raised)}.spinner i.on{background:var(--accent)}
.toast{padding:10px 16px;border-left:3px solid var(--accent);background:var(--raised);margin-bottom:18px;border-radius:6px}.modal-layer{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:24px}.modal{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 24px 100px #0008}.modal p{margin:18px 0}.modal-actions{display:flex;gap:16px;margin-top:28px}.modal-actions button{flex:1}[hidden]{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:24px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:3;display:flex;gap:10px;justify-content:center;padding:12px 24px}.nav button{width:200px;background:transparent;color:var(--muted)}.nav button[aria-current=page]{background:var(--accent);color:var(--bg)}.nav .icon{margin-right:10px;font-size:20px}
@media(max-width:720px){.shell{padding:20px 16px 104px}.two,.three,.equal,.launcher,.settings{grid-template-columns:1fr}h1{font-size:28px}.nav{gap:4px;padding:10px 6px}.nav button{padding:10px 4px;font-size:12px;width:auto;flex:1}.nav .icon{display:block;margin:0}.preview-bar{padding:10px 16px}.card{padding:20px}}
</style>
</head>
<body>
<div class="preview-bar"><strong id="preview-label"></strong><label><span id="scenario-label"></span><select id="scenario"><option value="offline">Offline / unknown</option><option value="mock">Connected / MOCK data</option></select></label><span class="small muted" id="preview-note"></span></div>
<div class="statusbar" id="statusbar"></div>
<main class="shell" id="app"></main><nav class="nav" id="nav" aria-label="Main navigation"></nav>
<div id="modal-layer" class="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body"><h2 id="modal-title"></h2><p id="modal-body"></p><p class="muted small" id="modal-help"></p><div class="modal-actions"><button id="reject"></button><button id="confirm" class="primary"></button></div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const themes=['graphite','paper','midnight','ember'];
/* Both presets fit the firmware parser's 80x28 buffer. The panel is 3.2
 * inches, which is why the larger cell is the default. */
const geometries=[{cols:80,rows:28,cw:12,ch:24,label:['compact','紧凑']},{cols:64,rows:22,cw:16,ch:32,label:['large','大字']}];
const apps=['translate','notes','agent','settings'];
const sections=['appearance','network','power','device','system'];
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('mixui-preview')||'{}');return {theme:themes.includes(p.theme)?p.theme:'graphite',lang:p.lang==='zh'?'zh':'en',geometry:p.geometry===0?0:1};}catch{return {theme:'graphite',lang:'en',geometry:1};}}
const state={...loadPrefs(),page:'home',section:'appearance',scenario:'offline',brightness:70,volume:60,kbd:0,focus:0,
 app:'shell',session:false,job:false,jobPercent:0,update:false,modal:null,touch:false,pointer:null,notice:'',
 history:[],scroll:0,actions:[],spin:0,networks:[],scanning:false,netView:'list',netSsid:'',netPass:'',netReveal:false};
const t=(en,zh)=>state.lang==='zh'?zh:en;
const unknown=()=>t('Unavailable','不可用');
const mock=()=>state.scenario==='mock';
const geom=()=>geometries[state.geometry];
function prefs(){try{localStorage.setItem('mixui-preview',JSON.stringify({theme:state.theme,lang:state.lang,geometry:state.geometry}));}catch{state.notice=t('Preferences cannot be saved in this browser.','此浏览器无法保存偏好。');}}
/* The device has no nav bar; these three entries exist so a preview reader can
 * reach the same screens the launcher and the Home key reach. */
const pageNames={home:['Home','首页','⌂'],app:['Application','应用','›_'],settings:['Settings','设置','☷']};
const appTitles={translate:['Live translation','实时翻译'],notes:['Notes','记笔记'],agent:['Agent','Agent'],shell:['Terminal','终端']};
function actionButton(action,en,zh,extra=''){return `<button data-action="${action}" ${extra}>${t(en,zh)}</button>`;}
function metric(en,zh,value,unit=''){return `<div class="card metric"><h3>${t(en,zh)}</h3><strong>${mock()?value:unknown()} ${mock()?`<small>${unit}</small>`:''}</strong></div>`;}

/* ---------- status bar ---------- */
function clockText(){return mock()?'09:24':'--:--';}
function statusbar(){
 const soc=mock()?76:null,bars=mock()?3:0;
 const title=state.page==='app'?t(...appTitles[state.app]):state.page==='settings'?t('Settings','设置'):'MixOS';
 const wifi=`<span class="bars" aria-hidden="true">${[6,9,12,16].map((h,i)=>`<i class="${mock()&&i<bars?'on':''}" style="height:${h}px"></i>`).join('')}</span>`;
 $('statusbar').innerHTML=`<span class="title">${escapeHTML(title)}</span>`+
  (mock()?'':`<span class="chip warn">${t('Linux offline','Linux 离线')}</span>`)+
  `<span class="chip">${wifi}<strong>${mock()?'cafe':t('Unknown','未知')}</strong></span>`+
  `<span class="chip"><strong>${soc===null?'--':soc+'%'}</strong><span class="batt"><span style="width:${soc===null?0:soc}%"></span></span></span>`+
  `<span class="chip"><strong>${clockText()}</strong></span>`;
}

/* ---------- home ---------- */
function launcherCard(index){
 const id=apps[index];
 const titles={translate:['Live translation','实时翻译'],notes:['Notes','记笔记'],agent:['Agent','Agent'],settings:['Settings','设置']};
 const subs={translate:['Speak, hear it back','说出来，听译文'],notes:['Write and dictate','书写与语音听写'],agent:['Reserved','预留'],settings:['Device and network','设备与网络']};
 const glyphs={translate:'文A',notes:'✎',agent:'◉',settings:'☷'};
 let state_text='',cls='state';
 if(id==='agent'){state_text=t('Placeholder: no backend yet','占位：暂无后端');}
 else if(id!=='settings'&&!mock()){state_text=t('Linux offline','Linux 离线');cls='state warn';}
 else if(id!=='settings'&&state.session&&state.app===id){state_text=t('Session running','会话运行中');cls='state accent';}
 return `<button class="launch-card" data-launch="${index}" aria-current="${state.focus===index}"><span class="glyph" aria-hidden="true">${glyphs[id]}</span><h2>${t(...titles[id])}</h2><p>${t(...subs[id])}</p><span class="${cls}">${escapeHTML(state_text)}</span></button>`;
}
function home(){return `<div class="launcher">${apps.map((_,i)=>launcherCard(i)).join('')}</div>
<p class="small muted section">${t('Number keys 1-4 and the arrow keys reach the same four buttons. The Home key returns here from anywhere.','数字键 1-4 与方向键可达同样四个按钮，Home 键可从任意位置返回这里。')}</p>`;}

/* ---------- application view ---------- */
function wide(cp){return cp>=0x1100&&(cp<=0x115f||cp===0x2329||cp===0x232a||(cp>=0x2e80&&cp<=0xa4cf)||(cp>=0xac00&&cp<=0xd7a3)||(cp>=0xf900&&cp<=0xfaff)||(cp>=0xfe10&&cp<=0xfe6f)||(cp>=0xff01&&cp<=0xff60)||(cp>=0xffe0&&cp<=0xffe6)||cp>=0x1f300);}
function terminalCells(s){const cols=geom().cols;let cells=[],col=0;for(const ch of s){const cp=ch.codePointAt(0);if(cp<32||cp===127)continue;const w=wide(cp)?2:1;if(col+w>cols)break;cells.push({ch,width:w});col+=w;}while(col<cols){cells.push({ch:' ',width:1});col++;}return cells;}
function terminalRows(){const rows=geom().rows;let end=Math.max(0,state.history.length-state.scroll),start=Math.max(0,end-rows),out=state.history.slice(start,end);while(out.length<rows)out.push('');return out;}
function feed(text){const cols=geom().cols,before=state.history.length;for(const line of String(text).split('\n')){let s='',n=0;for(const ch of line){const w=wide(ch.codePointAt(0))?2:1;if(n+w>cols){state.history.push(s);s='';n=0;}s+=ch;n+=w;}state.history.push(s);}
 if(state.scroll>0)state.scroll+=state.history.length-before;
 const cap=100+geom().rows;if(state.history.length>cap)state.history.splice(0,state.history.length-cap);
 state.scroll=Math.min(state.scroll,Math.max(0,state.history.length-geom().rows));}
function terminal(){const g=geom(),rows=terminalRows();
 return `<div class="terminal-toolbar"><span class="muted small">${t(...appTitles[state.app])} · ${state.session?t('session open · MOCK','会话已打开 · 模拟'):t('session closed','会话已关闭')} · ${g.cols}×${g.rows} · ${t('history','历史')} ${state.scroll}/100</span>${actionButton('older','↑ Older','↑ 更早')}${actionButton('newer','↓ Newer','↓ 更新')}${actionButton('live','Live','实时')}${actionButton(state.session?'close-session':'open-session',state.session?'Close':'Open',state.session?'关闭':'打开')}</div>
<div class="terminal-scroll"><div id="terminal-grid" class="terminal-grid" tabindex="0" role="log" aria-label="${g.cols} columns by ${g.rows} rows mock terminal" style="width:${g.cols*g.cw}px;height:${g.rows*g.ch}px;font-size:${Math.round(g.ch*0.8)}px;line-height:${g.ch}px">${rows.map((row,r)=>`<div class="term-row" style="height:${g.ch}px">${terminalCells(row).map((cell,c)=>`<span class="term-cell${state.session&&!state.scroll&&r===Math.min(state.history.length,g.rows-1)&&c===0?' cursor':''}" style="width:${cell.width*g.cw}px;min-width:${cell.width*g.cw}px;height:${g.ch}px;line-height:${g.ch}px">${escapeHTML(cell.ch)}</span>`).join('')}</div>`).join('')}</div></div>
<form class="terminal-entry" id="terminal-form"><input id="terminal-input" autocomplete="off" aria-label="${t('Mock terminal command','模拟终端命令')}" placeholder="${t('MOCK only: help, status, clear, history, 中文','仅模拟：help、status、clear、history、中文')}" ${state.session?'':'disabled'}><button type="submit" ${state.session?'':'disabled'}>${t('Send','发送')}</button></form>
<p class="small muted section">${t(`${g.cw} × ${g.ch} px cells. Shift+PageUp/Down scrolls locally. Commands are simulated, never executed. Output cannot approve maintenance.`,`${g.cw} × ${g.ch} 像素字符格。Shift+PageUp/Down 本地滚动。命令仅模拟，绝不执行。输出无法确认维护。`)}</p>`;}
function agentPlaceholder(){return `<section class="card placeholder"><span class="glyph" aria-hidden="true">◉</span><h2>${t('Agent is a placeholder','Agent 目前是占位')}</h2><p class="muted">${t('No backend is wired to this button yet.','这个按钮尚未接任何后端。')}</p><p class="muted small">${t('Press the Home key to go back.','按 Home 键返回。')}</p></section>`;}
function waiting(){return `<section class="card placeholder"><h2 class="${mock()?'':'warn'}">${mock()?t('Starting the application','正在启动应用'):t('Linux is offline','Linux 离线')}</h2>${mock()?`<div class="spinner" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i===state.spin%5?'on':''}"></i>`).join('')}</div>`:`<p class="muted">${t('Check the USB link, then try again','请检查 USB 连接后重试')}</p>`}</section>`;}
function application(){if(state.app==='agent')return agentPlaceholder();if(!state.session)return waiting();return terminal();}

/* ---------- settings sections ---------- */
function appearance(){return `<section class="card"><h3>${t('Theme and language / saved locally','主题与语言 / 本地保存')}</h3><div class="theme-grid">${themes.map((n,i)=>`<button data-action="theme-${n}" aria-pressed="${state.theme===n}"><span class="swatch" style="--swatch:${['#87ebc2','#187451','#88c1ff','#f4bc6a'][i]}"></span>${t(['Graphite mint','Paper forest','Midnight blue','Warm ember'][i],['石墨薄荷','纸白森林','午夜蓝','暖琥珀'][i])}</button>`).join('')}</div><div class="language-buttons"><button data-action="lang-en" aria-pressed="${state.lang==='en'}">English</button><button data-action="lang-zh" aria-pressed="${state.lang==='zh'}">中文</button></div></section>
<section class="card section"><h3>${t('Display, keyboard and sound','屏幕、键盘与声音')}</h3><div class="row section"><label for="brightness">${t('Brightness','亮度')}</label><strong id="brightness-value">${state.brightness}%</strong></div><input id="brightness" type="range" min="10" max="100" step="10" value="${state.brightness}"><div class="row control-row"><span>${t('Volume','音量')}</span><span><strong>${state.volume}%</strong> ${actionButton('volume-down','Quieter','调小')} ${actionButton('volume-up','Louder','调大')}</span></div><div class="row control-row"><span class="small muted">${t('Keyboard backlight','键盘背光')}</span>${actionButton('kbd',`Step ${state.kbd}/3`,`档位 ${state.kbd}/3`)}</div></section>
<section class="card section"><h3>${t('Terminal cell size','终端字符格')}</h3><div class="geometry-buttons">${geometries.map((g,i)=>`<button data-action="geometry-${i}" aria-pressed="${state.geometry===i}">${g.cols}×${g.rows} · ${t(...g.label)}</button>`).join('')}</div><p class="small muted section">${t('The panel is 3.2 inches; large cells are the readable default. Changing the size clears the grid and scrollback, because every stored coordinate becomes wrong.','屏幕只有 3.2 英寸，大字档更易读。切换字号会清空网格与历史，因为原有坐标全部失效。')}</p></section>`;}
function network(){
 if(state.netView==='connect')return `<section class="card"><h3>${t('Network','网络')}</h3><h2 style="margin-top:12px">${escapeHTML(state.netSsid)}</h2></section>
<section class="card section"><h3>${t('Passphrase','密码')}</h3><div class="passphrase"><input id="passphrase" type="text" autocomplete="off" aria-label="${t('Wi-Fi passphrase','Wi-Fi 密码')}" value="${state.netReveal?escapeHTML(state.netPass):'•'.repeat(state.netPass.length)}" ${state.netReveal?'':'readonly'}>${actionButton('net-reveal',state.netReveal?'Hide':'Show',state.netReveal?'隐藏':'显示',`aria-pressed="${state.netReveal}"`)}</div><p class="small muted section">${state.netPass.length} / 63 · ${t('Enter connects. Escape goes back. The passphrase is sent once and cleared.','回车连接，Escape 返回。密码只发送一次并随即清除。')}</p><div class="stack section">${actionButton('net-connect','Connect','连接','class="primary"')}${actionButton('net-forget','Forget this network','忘记此网络')}${actionButton('net-back','Back','返回')}</div></section>`;
 const banner=!mock()?`<p class="warn">${t('Linux offline: no radio to ask','Linux 离线：无法查询无线')}</p>`:`<p class="accent">${t('Connected','已连接')} cafe <span class="muted small">192.168.1.22</span></p>`;
 return `<section class="card"><div class="row"><div><h3>${t('Wi-Fi','无线网络')}</h3>${banner}</div>${actionButton('net-scan',state.scanning?'Scanning…':'Scan',state.scanning?'扫描中…':'扫描',state.scanning?'disabled':'')}</div>
<div class="net-list">${state.networks.length?state.networks.map((n,i)=>`<button class="net-row" data-network="${i}"><span class="ssid">${escapeHTML(n.ssid)}</span>${n.known?`<span class="tag saved">${t('saved','已保存')}</span>`:''}${n.secured?`<span class="tag">${t('locked','加密')}</span>`:''}<span class="bars" aria-hidden="true">${[6,9,12,16].map((h,k)=>`<i class="${k<1+Math.floor(n.signal*3/100)?'on':''}" style="height:${h}px"></i>`).join('')}</span></button>`).join(''):`<p class="muted">${state.scanning?t('Asking the host to scan','正在请求主机扫描'):t('No scan results yet','尚无扫描结果')}</p>`}</div>
<p class="small muted section">${t('The device asks; the host runs its own bounded wrapper. No command string crosses the link.','设备发起请求，主机用自身受限封装执行。链路上不传任何命令字符串。')}</p></section>`;}
function power(){let graph='';if(mock()){const points=(base,amp,phase)=>Array.from({length:61},(_,i)=>`${i*15},${base+Math.sin(i/7+phase)*amp+Math.cos(i/3)*3}`).join(' ');graph=`<polyline points="${points(64,15,0)}" stroke="var(--accent)"/><polyline points="${points(105,20,2)}" stroke="var(--warn)"/><polyline points="${points(35,8,3)}" stroke="var(--text)"/>`;}
 return `<div class="grid three">${metric('Battery voltage','电池电压','3.92','V')}${metric('Battery current','电池电流','1.10','A')}${metric('Battery power','电池功率','4.31','W')}${metric('USB voltage','USB 电压','5.08','V')}${metric('USB current','USB 电流','1.54','A')}${metric('USB power','USB 功率','7.82','W')}</div>
<div class="grid equal section"><section class="card"><h3>${t('Learned capacity','学习容量')}</h3><h2 class="warn">${unknown()}</h2><p class="muted small">${t('Calibration has not been verified. A default seed is not a measured capacity.','校准未验证，默认种子值不是实测容量。')}</p></section><section class="card"><h3>${t('Estimated runtime','预计续航')}</h3><h2 class="warn">${unknown()}</h2><p class="muted small">${t('Requires verified calibration and valid load samples.','需要已验证校准与有效负载采样。')}</p></section></div>
<section class="card section"><div class="row"><h3>${t('Last hour','最近一小时')}</h3><span class="small muted">${mock()?t('MOCK history · 5 second cadence','模拟历史 · 5 秒采样间隔'):t('Waiting for real samples','等待真实采样')}</span></div><svg viewBox="0 0 900 160" role="img" aria-label="${t('One hour voltage current and charge history','一小时电压、电流、电量曲线')}">${[20,60,100,140].map(y=>`<line class="gridline" x1="0" y1="${y}" x2="900" y2="${y}"/>`).join('')}${graph}</svg><div class="legend"><span class="accent">● ${t('Voltage','电压')} 3.0–4.4 V</span><span class="warn">● ${t('Current','电流')} −2–2 A</span><span>● ${t('Charge','电量')} 0–100%</span></div></section>`;}
function device(){const sensorNames=['AW9523','INA219 VBAT','INA219 USB','STC3117','CW2015','GT911','Keyboard','ES8389','IMU','AUX'];
 return `<section class="card"><h3>${t('Sensor presence / checked by the device service','传感器在位 / 由设备服务检测')}</h3><div class="sensor-grid">${sensorNames.map((n,i)=>`<div class="sensor">${n}<span>${mock()?(i===4?t('Absent · MOCK','未在位 · 模拟'):t('Present · MOCK','在位 · 模拟')):t('Unknown','未知')}</span></div>`).join('')}</div><p class="small muted section">${t('Preview labels are illustrative; firmware displays shared sensor-mask indices.','预览名称为示例；固件按共享传感器位掩码索引显示。')}</p></section>
<div class="grid equal section"><section class="card"><h3>${t('Audio','音频')}</h3><h2 style="margin-top:16px">${mock()?t('Headphones inserted','耳机已插入'):t('Jack unknown','耳机状态未知')}</h2>${['L','R'].map((c,i)=>`<div class="row section"><span>${c}</span><div class="bar" style="flex:1;margin:0"><span style="width:${mock()?(i?26:42):0}%"></span></div></div>`).join('')}</section>
<section class="card"><h3>${t('Keyboard / memory','键盘 / 内存')}</h3><p>${mock()?t('Keyboard connected · MOCK','键盘已连接 · 模拟'):t('Keyboard offline','键盘离线')}</p><p class="muted small">${t('Input resyncs','输入重新同步')}: ${mock()?'0':t('Unknown','未知')}</p><p class="muted small">PSRAM: ${mock()?'3.20 MiB · MOCK':t('Unknown','未知')}</p><div class="section">${actionButton('reset','Reset local input','重置本地输入')}</div></section></div>
<section class="card section"><div class="row"><h3>${t('Single-finger touch test','单指触摸测试')}</h3>${actionButton('touch',state.touch?'Stop test':'Start test',state.touch?'结束测试':'开始测试',`aria-pressed="${state.touch}"`)}</div><div id="touch-pad" class="touch-pad ${state.touch?'testing':''}"><span id="touch-hint">${state.touch?t('Move one finger here','在此区域移动单指'):t('Start to inspect local coordinates','开始后显示本地触摸坐标')}</span><span id="touch-dot" class="touch-dot" hidden></span></div><p class="small muted" id="touch-coordinates">X — · Y — · ${t('No touch','无触摸')}</p></section>`;}
function system(){return `<section class="card"><h3>${t('Versions and connection','版本与连接')}</h3><div class="row control-row"><span>MixOS</span><span>0.3.0-deck</span></div><div class="row control-row"><span>ESP32-S3 / USB</span><span>protocol v1 · ${geom().cols}×${geom().rows}</span></div><div class="row control-row"><span>Linux / QMK</span><span class="muted">${t('Not reported','未报告')}</span></div><p class="small muted">${mock()?'Linux CPU 12% / RAM 312/1024 MiB / up 48 min · MOCK':t('Linux metrics unavailable','Linux 指标不可用')}</p></section>
<section class="card section"><h3>${t('Firmware','固件')}</h3><p class="muted">${state.update?t('New build on trial','新固件试运行中'):t('A/B update over USB','通过 USB 进行 A/B 升级')}</p><p class="small muted">${t('Run tools/deploy_ota.py on Linux. Terminal output cannot start or approve an update.','在 Linux 上运行 tools/deploy_ota.py。终端输出无法发起或批准更新。')}</p><div class="section">${actionButton('update','Simulate update request','模拟更新请求')}${' '}${actionButton('output-test','Test untrusted output','测试不可信输出')}</div></section>
<section class="card section"><h3>${t('Maintenance and shell / local consent','维护与命令行 / 本地确认')}</h3><p class="muted small">${t('Only explicit local confirmation can enqueue an action. All preview actions are MOCK.','只有明确本地确认才会提交操作。本预览所有操作均为模拟。')}</p><div class="stack section">${actionButton(state.job?'cancel-job':'maintenance',state.job?'Cancel task':'Run maintenance',state.job?'取消任务':'运行维护')}${state.job?actionButton('advance-job','Advance mock task +25%','推进模拟任务 +25%'):''}${actionButton('open-shell','Open a shell','打开命令行')}</div><p class="small muted">${state.job?t(`Running · ${state.jobPercent}% · MOCK`,`运行中 · ${state.jobPercent}% · 模拟`):t('Idle','空闲')}</p></section>`;}
function settings(){const names={appearance:['Appearance','外观'],network:['Network','网络'],power:['Power','电源'],device:['Device','设备'],system:['System','系统']};
 const body={appearance,network,power,device,system}[state.section]();
 return `<div class="settings"><div class="rail">${sections.map(id=>`<button data-section="${id}" ${state.section===id?'aria-current="page"':''}>${t(...names[id])}</button>`).join('')}</div><div>${body}</div></div>`;}

/* ---------- rendering ---------- */
function render(){
 document.documentElement.dataset.theme=state.theme;document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
 $('preview-label').textContent=t('MixOS / OFFLINE PREVIEW','MixOS / 离线预览');
 $('scenario-label').textContent=t('Scenario','场景');
 $('preview-note').textContent=t('No network · No hardware · MOCK controls','无网络 · 无硬件 · 模拟控制');
 $('scenario').value=state.scenario;
 $('scenario').options[0].textContent=t('Offline / unknown','离线 / 未知');
 $('scenario').options[1].textContent=t('Connected / MOCK data','已连接 / 模拟数据');
 statusbar();
 $('nav').innerHTML=Object.entries(pageNames).map(([id,n])=>`<button data-page="${id}" ${state.page===id?'aria-current="page"':''}><span class="icon" aria-hidden="true">${n[2]}</span>${t(n[0],n[1])}</button>`).join('');
 $('app').innerHTML=(state.notice?`<div class="toast" role="status">${escapeHTML(state.notice)}</div>`:'')+({home,app:application,settings}[state.page])()+`<footer>${t('Standalone design preview · All telemetry is unknown or explicitly marked MOCK.','独立界面预览 · 所有遥测均为未知或明确标记的模拟数据。')}</footer>`;
 bindTouch();renderModal();
}
function request(kind){if(state.modal)return;state.modal=kind;renderModal();}
let modalFocus=null;
function renderModal(){const layer=$('modal-layer'),wasHidden=layer.hidden;layer.hidden=!state.modal;$('app').inert=!!state.modal;$('nav').inert=!!state.modal;$('scenario').disabled=!!state.modal;if(!state.modal)return;if(wasHidden)modalFocus=document.activeElement;
 const messages={maintenance:['Run the configured maintenance task?','运行预设维护任务？'],'cancel-job':['Cancel the running maintenance task?','取消正在运行的维护任务？'],update:['Approve the pending firmware update?','批准待处理的固件更新？'],reset:['Reset the local input state?','重置本地输入状态？'],'net-forget':['Forget this saved network?','忘记这个已保存的网络？']};
 $('modal-title').textContent=t('Confirm on this device','请在本机确认');
 $('modal-body').textContent=t(...messages[state.modal]);
 $('modal-help').textContent=t('MOCK ONLY. Local click or Enter confirms. Escape rejects. Terminal output cannot approve this request.','仅模拟。本地点击或回车确认，Escape 拒绝。终端输出无法批准此请求。');
 $('reject').textContent=t('Reject / Escape','拒绝 / Escape');$('confirm').textContent=t('Confirm / Enter','确认 / Enter');
 if(wasHidden)$('reject').focus();
}
function resolve(accepted){const kind=state.modal;if(!kind)return;state.modal=null;state.actions.push({kind,accepted,mock:true});
 if(accepted){if(kind==='maintenance'){state.job=true;state.jobPercent=0;}if(kind==='cancel-job')state.job=false;if(kind==='reset'){state.pointer=null;state.touch=false;}
  if(kind==='net-forget'){state.netView='list';state.netPass='';state.netReveal=false;}}
 if(kind==='update')state.update=false;
 state.notice=t(`${accepted?'Confirmed':'Rejected'}: ${kind} · MOCK only`,`${accepted?'已确认':'已拒绝'}：${kind} · 仅模拟`);
 render();if(modalFocus&&modalFocus.isConnected)modalFocus.focus();else $('nav').querySelector('[aria-current="page"]').focus();
}
/* ---------- behaviour ---------- */
function launch(index){
 if(state.modal)return;
 const id=apps[index];state.focus=index;
 if(id==='settings'){state.page='settings';render();return;}
 state.app=id;state.page='app';
 if(id==='agent'){state.notice=t('Agent has no backend; nothing was started.','Agent 无后端，未启动任何程序。');render();return;}
 openSession();
}
function openSession(){
 if(!mock()){state.session=false;state.notice=t('Linux offline. Choose the MOCK scenario to try a session.','Linux 离线。选择模拟场景可体验会话。');render();return;}
 state.session=true;
 if(!state.history.length)feed(`MixOS / USB CDC terminal — MOCK SESSION\n${geom().cols} columns x ${geom().rows} rows / 100 history lines\n中文双宽字符 · ASCII fixed cells\nType help. Nothing is executed on your machine.\n`);
 render();
}
function setGeometry(index){
 if(index===state.geometry||!geometries[index])return;
 state.geometry=index;
 /* A geometry change invalidates every stored coordinate, so the firmware
  * clears the grid and scrollback rather than guessing a reflow. */
 state.history=[];state.scroll=0;prefs();
 state.notice=t('Terminal resized; grid and scrollback cleared.','终端已改变字号，网格与历史已清空。');
}
function dispatch(action){
 if(state.modal)return;
 if(action.startsWith('theme-')){const n=action.slice(6);if(themes.includes(n)){state.theme=n;prefs();}}
 else if(action.startsWith('lang-')){state.lang=action==='lang-zh'?'zh':'en';prefs();}
 else if(action.startsWith('geometry-'))setGeometry(Number(action.slice(9)));
 else if(action==='open-session'){openSession();return;}
 else if(action==='close-session'){state.session=false;state.notice=t('Mock session closed. History retained.','模拟会话已关闭，历史保留。');}
 else if(action==='open-shell'){state.app='shell';state.page='app';openSession();return;}
 else if(action==='older')state.scroll=Math.min(Math.max(0,state.history.length-geom().rows),state.scroll+14);
 else if(action==='newer')state.scroll=Math.max(0,state.scroll-14);
 else if(action==='live')state.scroll=0;
 else if(action==='touch'){state.touch=!state.touch;state.pointer=null;}
 else if(action==='kbd')state.kbd=(state.kbd+1)%4;
 else if(action==='volume-up')state.volume=Math.min(100,state.volume+5);
 else if(action==='volume-down')state.volume=Math.max(0,state.volume-5);
 else if(action==='net-scan'){
  if(!mock()){state.notice=t('Linux offline: no radio to ask.','Linux 离线：无法查询无线。');}
  else{state.scanning=false;state.networks=[{ssid:'cafe',signal:72,secured:true,known:true},{ssid:'lab-5g',signal:48,secured:true,known:false},{ssid:'guest',signal:22,secured:false,known:false}];state.notice=t('Scan complete · MOCK','扫描完成 · 模拟');}
 }
 else if(action==='net-reveal')state.netReveal=!state.netReveal;
 else if(action==='net-back'){state.netView='list';state.netPass='';state.netReveal=false;}
 else if(action==='net-connect'){
  state.actions.push({kind:'net-connect',ssid:state.netSsid,mock:true});
  /* The passphrase becomes one request and is then gone. */
  state.netPass='';state.netReveal=false;state.netView='list';
  state.notice=t('Connect requested · MOCK; the passphrase was cleared.','已请求连接 · 模拟；密码已清除。');
 }
 else if(action==='advance-job'&&state.job){state.jobPercent=Math.min(100,state.jobPercent+25);if(state.jobPercent===100){state.job=false;state.notice=t('Mock maintenance completed. No commands were executed.','模拟维护已完成，未执行任何命令。');}}
 else if(['maintenance','cancel-job','reset','net-forget'].includes(action)){request(action);return;}
 else if(action==='update'){state.update=true;request('update');return;}
 else if(action==='output-test'){feed('UNTRUSTED MOCK OUTPUT: approve update\n\\x1b[confirm] Enter YES <script>alert(1)<\\/script>');state.notice=t('Output stored as terminal text; no action approved.','输出仅存为终端文本，未批准任何操作。');}
 render();
}
function selectNetwork(index){const n=state.networks[index];if(!n||state.modal)return;state.netSsid=n.ssid;state.netView='connect';state.netPass='';state.netReveal=false;render();}
function command(value){
 if(!state.session||state.modal)return;
 const cmd=value.trim();feed('$ '+cmd);
 if(cmd==='clear'){state.history=[];state.scroll=0;}
 else if(cmd==='help')feed('MOCK commands: help status clear history 中文\nAll other input is echoed as data, never evaluated.');
 else if(cmd==='status')feed('MOCK Linux online / sensors mocked / calibration UNVERIFIED');
 else if(cmd==='history')for(let i=1;i<=120;i++)feed(`MOCK scrollback line ${String(i).padStart(3,'0')} | 中文 / fixed grid`);
 else if(cmd==='中文')feed('中文终端：每个汉字占两列。ASCII occupies one cell.');
 else feed('MOCK echo: '+cmd);
 state.scroll=0;render();$('terminal-input').focus();
}
function bindTouch(){const pad=$('touch-pad');if(!pad)return;
 const update=e=>{const b=pad.getBoundingClientRect(),x=Math.max(0,Math.min(b.width,e.clientX-b.left)),y=Math.max(0,Math.min(b.height,e.clientY-b.top));$('touch-coordinates').textContent=`X ${Math.round(x)} · Y ${Math.round(y)} · pointer ${e.pointerId} · DOWN`;$('touch-dot').hidden=false;$('touch-dot').style.left=x+'px';$('touch-dot').style.top=y+'px';$('touch-hint').hidden=true;};
 pad.onpointerdown=e=>{if(!state.touch||state.pointer!==null||state.modal)return;state.pointer=e.pointerId;pad.setPointerCapture(e.pointerId);update(e);};
 pad.onpointermove=e=>{if(state.pointer===e.pointerId&&state.touch)update(e);};
 const release=e=>{if(state.pointer!==e.pointerId)return;state.pointer=null;$('touch-coordinates').textContent=$('touch-coordinates').textContent.replace('DOWN','UP');};
 pad.onpointerup=release;pad.onpointercancel=release;pad.onlostpointercapture=release;
}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-launch]');if(l){launch(Number(l.dataset.launch));return;}
 const w=e.target.closest('[data-network]');if(w){selectNetwork(Number(w.dataset.network));return;}
 const s=e.target.closest('[data-section]');if(s&&!state.modal){state.section=s.dataset.section;state.netView='list';state.netPass='';state.pointer=null;render();return;}
 const p=e.target.closest('[data-page]');if(p&&!state.modal){state.page=p.dataset.page;state.pointer=null;render();return;}
 const a=e.target.closest('[data-action]');if(a)dispatch(a.dataset.action);
});
document.addEventListener('submit',e=>{if(e.target.id==='terminal-form'){e.preventDefault();command($('terminal-input').value);}});
document.addEventListener('input',e=>{
 if(state.modal)return;
 if(e.target.id==='brightness'){state.brightness=Math.max(10,Math.min(100,Number(e.target.value)));$('brightness-value').textContent=state.brightness+'%';}
 else if(e.target.id==='passphrase')state.netPass=String(e.target.value).slice(0,63);
});
$('scenario').addEventListener('change',e=>{if(state.modal)return;state.scenario=e.target.value==='mock'?'mock':'offline';state.session=false;state.notice='';render();});
$('reject').onclick=()=>resolve(false);$('confirm').onclick=()=>resolve(true);
document.addEventListener('keydown',e=>{
 if(state.modal){if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();e.stopPropagation();resolve(e.key==='Enter');}else if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('reject')?$('confirm'):$('reject')).focus();}return;}
 if(state.page==='home'){
  if(e.key>='1'&&e.key<='4'){e.preventDefault();launch(Number(e.key)-1);return;}
  if(e.key==='Enter'){e.preventDefault();launch(state.focus);return;}
  if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();state.focus=e.key==='ArrowRight'?(state.focus+1)%4:e.key==='ArrowLeft'?(state.focus+3)%4:(state.focus+2)%4;render();return;}
 }
 if(state.page==='app'&&e.shiftKey&&['PageUp','PageDown'].includes(e.key)){e.preventDefault();dispatch(e.key==='PageUp'?'older':'newer');}
});
/* Deliberately no background network, timer, shell execution, or telemetry sampler. */
window.MixPreview={state,dispatch,request,resolve,feed,command,launch,selectNetwork,setGeometry,terminalCells,terminalRows,geom,render};
render();
</script>
</body></html>
